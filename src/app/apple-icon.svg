<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="50%" stop-color="#B30000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect x="4" y="4" width="172" height="172" rx="44" fill="url(#ytGrad)"/>
  <rect x="4" y="4" width="172" height="86" rx="44" fill="url(#topGlow)"/>
  <rect x="6" y="6" width="168" height="168" rx="42" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  
  <polygon points="70,54 70,126 130,90" fill="#FFFFFF" filter="url(#shadow)"/>
</svg>
