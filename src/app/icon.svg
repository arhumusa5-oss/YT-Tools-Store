<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ytGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A"/>
      <stop offset="50%" stop-color="#B30000"/>
      <stop offset="100%" stop-color="#660000"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer rounded squircle -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#ytGrad)"/>
  <rect x="4" y="4" width="120" height="60" rx="32" fill="url(#topGlow)"/>
  <rect x="5" y="5" width="118" height="118" rx="31" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Centered YouTube Play Button -->
  <polygon points="50,38 50,90 92,64" fill="#FFFFFF" filter="url(#shadow)"/>
</svg>
